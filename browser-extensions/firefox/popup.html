<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>true-ai-export</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #111;
      background: #fff;
      width: 220px;
    }

    .header {
      padding: 12px 14px 10px;
      border-bottom: 1px solid #eee;
    }

    .header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      margin-bottom: 2px;
    }

    .header p {
      font-size: 11px;
      color: #888;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #999;
      padding: 10px 14px 4px;
    }

    .format-list {
      list-style: none;
      padding: 0 6px 6px;
    }

    .format-list li button {
      width: 100%;
      text-align: left;
      padding: 7px 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 12px;
      color: #111;
      border-radius: 4px;
      line-height: 1.3;
    }

    .format-list li button:hover {
      background: #f0f0f0;
    }

    .format-list li button .format-name {
      display: block;
      font-weight: 500;
    }

    .format-list li button .format-desc {
      display: block;
      font-size: 10px;
      color: #888;
      margin-top: 1px;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 4px 0;
    }

    .status {
      padding: 10px 14px;
      font-size: 11px;
      color: #555;
      border-top: 1px solid #eee;
      display: none;
    }

    .status.visible {
      display: block;
    }

    .status.success { color: #166534; }
    .status.warning { color: #92400e; }
    .status.error { color: #991b1b; }

    .not-claude {
      padding: 16px 14px;
      font-size: 12px;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }

    .footer {
      padding: 8px 14px;
      border-top: 1px solid #eee;
      font-size: 10px;
      color: #bbb;
      text-align: center;
    }

    .footer a {
      color: #bbb;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>true-ai-export</h1>
    <p>Save to file</p>
  </div>

  <div id="main-content">

    <div class="section-label">Text formats</div>
    <ul class="format-list">
      <li>
        <button data-format="markdown-clean">
          <span class="format-name">Markdown (clean)</span>
          <span class="format-desc">Readable conversation only</span>
        </button>
      </li>
      <li>
        <button data-format="markdown">
          <span class="format-name">Markdown</span>
          <span class="format-desc">Full — all content flagged</span>
        </button>
      </li>
      <li>
        <button data-format="plaintext-clean">
          <span class="format-name">Plain text (clean)</span>
          <span class="format-desc">Readable conversation only</span>
        </button>
      </li>
      <li>
        <button data-format="plaintext">
          <span class="format-name">Plain text</span>
          <span class="format-desc">Full — all content flagged</span>
        </button>
      </li>
    </ul>

    <hr class="divider">

    <div class="section-label">Document formats</div>
    <ul class="format-list">
      <li>
        <button data-format="html-clean">
          <span class="format-name">HTML (clean)</span>
          <span class="format-desc">Styled — readable conversation</span>
        </button>
      </li>
      <li>
        <button data-format="html">
          <span class="format-name">HTML</span>
          <span class="format-desc">Styled — full, all content flagged</span>
        </button>
      </li>
      <li>
        <button data-format="json">
          <span class="format-name">JSON</span>
          <span class="format-desc">Structured data — all content</span>
        </button>
      </li>
    </ul>

    <hr class="divider">

    <div class="section-label">Print / PDF</div>
    <ul class="format-list">
      <li>
        <button data-format="pdf-clean-serif">
          <span class="format-name">PDF — serif (clean)</span>
          <span class="format-desc">Print dialog — formal use</span>
        </button>
      </li>
      <li>
        <button data-format="pdf-serif">
          <span class="format-name">PDF — serif</span>
          <span class="format-desc">Print dialog — full</span>
        </button>
      </li>
      <li>
        <button data-format="pdf-clean-sans">
          <span class="format-name">PDF — sans-serif (clean)</span>
          <span class="format-desc">Print dialog — general use</span>
        </button>
      </li>
      <li>
        <button data-format="pdf-sans">
          <span class="format-name">PDF — sans-serif</span>
          <span class="format-desc">Print dialog — full</span>
        </button>
      </li>
    </ul>

  </div>

  <div id="not-claude" class="not-claude" style="display:none;">
    Open a Claude.ai conversation to export it.
  </div>

  <div id="status" class="status"></div>

  <div class="footer">
    <a href="https://github.com/filteredwaterdev/true-ai-export"
       target="_blank">
      github.com/filteredwaterdev/true-ai-export
    </a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
